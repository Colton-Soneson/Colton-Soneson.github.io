<!doctype html>

<html>
  <head>
    <meta charset="utf-8">
    <!-- phones lay the page out at their own size instead of zoomed out, and the canvas can run under a notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>WebGPU Life</title>
	<!-- deferred: it downloads alongside everything else instead of holding up the first picture of the page, and still runs before main.js -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/9.3.2/math.js" defer></script>

	<!-- ImGUI (lil-gui): the script is imported by code/imguiLoader.js. Its style sheet is not waited for before the page is drawn (the controls come much later) -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.min.css" media="print" onload="this.media='all'">

	<!-- the canvas covers the whole page, whatever size the window is. What it is drawn at is the Resolution setting (see code/display.js).
	     (body > canvas: the page's own canvas only, not the graphs inside the Performance window) -->
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
		body > canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

		/* the loading screen: see code/loading.js. Charcoal on paper, as the journal and the map (code/charcoal.js) */
		#loading { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
			background: #e6dcc4 radial-gradient(ellipse at 50% 45%, rgba(255, 248, 230, 0.5), rgba(70, 50, 30, 0.22)); color: #2b2520;
			font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; transition: opacity 0.6s ease; overflow: hidden; }
		#loading.loading-hidden { display: none; }
		#loading.loading-done { opacity: 0; pointer-events: none; }
		#loading .loading-sheet { position: relative; width: min(70vh, 86vw); height: min(70vh, 86vw); display: flex; align-items: center; justify-content: center; }
		#loading .loading-sheet::before { content: ""; position: absolute; inset: 6%; border: 2px dashed rgba(43, 37, 32, 0.25); border-radius: 3px 6px 2px 5px; }
		#loading.loading-has-map .loading-sheet::before { display: none; }
		#loading .loading-map { position: absolute; inset: 0; width: 100%; height: 100%; box-shadow: 0 10px 40px rgba(40, 28, 18, 0.45); border-radius: 2px; will-change: transform; }
		#loading .loading-hand { position: absolute; width: 38px; height: 38px; left: 50%; top: 50%; animation: loading-sketch 1.6s ease-in-out infinite; }
		#loading.loading-has-map .loading-hand { display: none; }
		#loading .loading-title { font-size: 24px; letter-spacing: 0.05em; }
		#loading .loading-stage { font-size: 14px; opacity: 0.7; min-height: 1.3em; }
		#loading .loading-bar { width: min(340px, 70vw); height: 12px; border: 2px solid #2b2520; border-radius: 4px 2px 5px 3px; padding: 2px; filter: url(#charcoal); }
		#loading .loading-bar > div { width: 5%; height: 100%; border-radius: 2px; transition: width 0.4s ease;
			background: repeating-linear-gradient(115deg, #2b2520 0 3px, rgba(43, 37, 32, 0.6) 3px 5px, #2b2520 5px 8px); }
		#loading.loading-zooming .loading-title, #loading.loading-zooming .loading-stage, #loading.loading-zooming .loading-bar { opacity: 0; transition: opacity 0.4s; }
		#loading .loading-error { max-width: min(460px, 85vw); text-align: center; font-size: 14px; line-height: 1.5; color: #7a2a18; display: none; }
		#loading.loading-failed .loading-error { display: block; }
		#loading.loading-failed .loading-hand { animation: none; }
		@keyframes loading-sketch { 0% { transform: translate(-80px, -30px) rotate(-8deg); } 25% { transform: translate(20px, 10px) rotate(4deg); } 50% { transform: translate(-30px, 40px) rotate(-4deg); }
			75% { transform: translate(70px, -10px) rotate(6deg); } 100% { transform: translate(-80px, -30px) rotate(-8deg); } }
	</style>
  </head>
  <body>
    <canvas width="1920" height="1080"></canvas>

	<!-- up before anything else has loaded, gone once the first frames are drawn -->
	<div id="loading">
		<div class="loading-sheet"><svg class="loading-hand" viewBox="0 0 40 40"><path d="M6 34 L28 10 L33 15 L11 39 Z" fill="#2b2520"/><path d="M28 10 L31 5 L37 11 L33 15 Z" fill="#6a5a48"/><path d="M2 38 q6 -4 9 -2" stroke="#2b2520" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
		<div class="loading-title">Loading</div>
		<div class="loading-stage">Downloading</div>
		<div class="loading-bar"><div></div></div>
		<div class="loading-error"></div>
	</div>
	<script>
		// if it cannot run here, or something goes wrong while it loads, the loading screen says so instead of spinning for ever
		(function () {
			const screen = document.getElementById('loading');
			const fail = (text) => {
				if (!screen || !screen.isConnected || screen.classList.contains('loading-failed')) return;	// (the first thing that went wrong is the one worth reading)
				screen.classList.add('loading-failed');
				screen.querySelector('.loading-title').textContent = 'Could not start';
				screen.querySelector('.loading-error').textContent = text;
			};
			if (!navigator.gpu) {
				fail('This site draws with WebGPU, which this browser does not have (or has turned off). A recent Chrome or Edge on a desktop will run it.');
			}
			window.addEventListener('error', (event) => fail('Something went wrong while loading: ' + event.message));
			window.addEventListener('unhandledrejection', (event) => fail('Something went wrong while loading: ' + (event.reason && event.reason.message || event.reason)));
		})();
	</script>

    <script type="module" src="main.js" defer></script>
  </body>
</html>
