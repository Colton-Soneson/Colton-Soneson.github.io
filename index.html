<!doctype html>

<html>
  <head>
    <meta charset="utf-8">
    <!-- phones lay the page out at their own size instead of zoomed out, and the canvas can run under a notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>WebGPU Life</title>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/9.3.2/math.js"></script>

	<!-- ImGUI (lil-gui) -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.min.css">
	<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.min.js"></script>

	<!-- the canvas covers the whole page, whatever size the window is. What it is drawn at is the Resolution setting (see code/display.js) -->
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
		canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
	</style>
  </head>
  <body>
    <canvas width="1920" height="1080"></canvas>
    <script type="module" src="main.js" defer></script>
  </body>
</html>
